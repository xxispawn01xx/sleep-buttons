name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests and APK
        shell: bash
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug > build.log 2>&1
          code=$?
          set -e
          tail -60 build.log
          if [ $code -ne 0 ]; then
            # Surface the useful lines as an annotation (readable via the API).
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Could not|Exception|expected:|> " build.log | head -60 | cut -c1-400)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/'%0D'}"
            echo "::error title=Build failed::$msg"
            exit $code
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: SleepButtons-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
